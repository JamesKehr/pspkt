        run: |
          foreach($name in @('Contract','Compilation','Ci')) { . (Join-Path $env:GITHUB_WORKSPACE ('certification\broker-lifecycle\lib\Pspkt.Certification.BrokerLifecycle'+$name+'.ps1')) }
          $probe=ConvertFrom-PspktBrokerLifecycleTransport $env:PROBE 1024
          $group=Confirm-PspktBrokerLifecyclePreflightGroup $probe $env:RAW_OUTCOME (Get-PspktBrokerLifecycleWorkflowContext powershell_7)
          Write-PspktBrokerLifecycleWorkflowOutput group $group 4096
  aggregate:
    needs: [windows_ps51, powershell_7]
    runs-on: windows-latest
    env:
      PSPKT_BROKER_INPUTS: ${{ github.workspace }}\..\bl-inputs-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          persist-credentials: false
      - name: Stage Desktop checkout receipt
        shell: pwsh
        env:
          PSPKT_INPUT: ${{ needs.windows_ps51.outputs.checkout }}
        run: |
          foreach($name in @('Contract','Compilation','Ci')) { . (Join-Path $env:GITHUB_WORKSPACE ('certification\broker-lifecycle\lib\Pspkt.Certification.BrokerLifecycle'+$name+'.ps1')) }
          Save-PspktBrokerLifecycleTransportPart $env:PSPKT_BROKER_INPUTS windows-checkout $env:PSPKT_INPUT
      - name: Stage Desktop export receipt
        shell: pwsh
        env:
          PSPKT_INPUT: ${{ needs.windows_ps51.outputs.export }}
        run: |
          foreach($name in @('Contract','Compilation','Ci')) { . (Join-Path $env:GITHUB_WORKSPACE ('certification\broker-lifecycle\lib\Pspkt.Certification.BrokerLifecycle'+$name+'.ps1')) }
          Save-PspktBrokerLifecycleTransportPart $env:PSPKT_BROKER_INPUTS windows-export $env:PSPKT_INPUT
      - name: Stage Core checkout receipt
        shell: pwsh
        env:
          PSPKT_INPUT: ${{ needs.powershell_7.outputs.checkout }}
        run: |
          foreach($name in @('Contract','Compilation','Ci')) { . (Join-Path $env:GITHUB_WORKSPACE ('certification\broker-lifecycle\lib\Pspkt.Certification.BrokerLifecycle'+$name+'.ps1')) }
          Save-PspktBrokerLifecycleTransportPart $env:PSPKT_BROKER_INPUTS core-checkout $env:PSPKT_INPUT
      - name: Stage Core export receipt
        shell: pwsh
        env:
          PSPKT_INPUT: ${{ needs.powershell_7.outputs.export }}
        run: |
          foreach($name in @('Contract','Compilation','Ci')) { . (Join-Path $env:GITHUB_WORKSPACE ('certification\broker-lifecycle\lib\Pspkt.Certification.BrokerLifecycle'+$name+'.ps1')) }
          Save-PspktBrokerLifecycleTransportPart $env:PSPKT_BROKER_INPUTS core-export $env:PSPKT_INPUT
      - name: Stage Desktop boundary group
        shell: pwsh
        env:
          PSPKT_INPUT: ${{ needs.windows_ps51.outputs.boundaries }}
        run: |
          foreach($name in @('Contract','Compilation','Ci')) { . (Join-Path $env:GITHUB_WORKSPACE ('certification\broker-lifecycle\lib\Pspkt.Certification.BrokerLifecycle'+$name+'.ps1')) }
          Save-PspktBrokerLifecycleTransportPart $env:PSPKT_BROKER_INPUTS windows-boundaries $env:PSPKT_INPUT
      - name: Stage Core boundary group
        shell: pwsh
        env:
          PSPKT_INPUT: ${{ needs.powershell_7.outputs.boundaries }}
        run: |
          foreach($name in @('Contract','Compilation','Ci')) { . (Join-Path $env:GITHUB_WORKSPACE ('certification\broker-lifecycle\lib\Pspkt.Certification.BrokerLifecycle'+$name+'.ps1')) }
          Save-PspktBrokerLifecycleTransportPart $env:PSPKT_BROKER_INPUTS core-boundaries $env:PSPKT_INPUT
      - name: Stage Desktop preflight group
        shell: pwsh
        env:
          PSPKT_INPUT: ${{ needs.windows_ps51.outputs.preflight }}
        run: |
          foreach($name in @('Contract','Compilation','Ci')) { . (Join-Path $env:GITHUB_WORKSPACE ('certification\broker-lifecycle\lib\Pspkt.Certification.BrokerLifecycle'+$name+'.ps1')) }
          Save-PspktBrokerLifecycleTransportPart $env:PSPKT_BROKER_INPUTS windows-preflight $env:PSPKT_INPUT
      - name: Stage Core preflight group
        shell: pwsh
        env:
          PSPKT_INPUT: ${{ needs.powershell_7.outputs.preflight }}
        run: |
          foreach($name in @('Contract','Compilation','Ci')) { . (Join-Path $env:GITHUB_WORKSPACE ('certification\broker-lifecycle\lib\Pspkt.Certification.BrokerLifecycle'+$name+'.ps1')) }
          Save-PspktBrokerLifecycleTransportPart $env:PSPKT_BROKER_INPUTS core-preflight $env:PSPKT_INPUT
      - name: Verify complete current-attempt aggregate
        shell: pwsh
        run: |
          foreach($name in @('Contract','Compilation','Ci')) { . (Join-Path $env:GITHUB_WORKSPACE ('certification\broker-lifecycle\lib\Pspkt.Certification.BrokerLifecycle'+$name+'.ps1')) }
          Invoke-PspktBrokerLifecycleAggregate $env:GITHUB_WORKSPACE $env:PSPKT_BROKER_INPUTS
